<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Cel | Productos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">
          <span class="brand-mark">U</span>
          <span>Urban Cel</span>
        </a>

        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="productos.html" class="active">Productos</a>
          <a href="accesorios.html">Accesorios</a>
          <a href="nosotros.html">Sobre nosotros</a>
          <a href="contacto.html">Contacto</a>
        </nav>

        <div class="nav-actions">
          <a href="carrito.html" class="cart-link" aria-label="Carrito de compras">
            <span>🛒</span>
            <span class="cart-count" id="cartCount">0</span>
          </a>
          <div class="user-menu">
            <span class="user-pill" data-user-label>Usuario</span>
            <button class="btn btn-light btn-small" id="logoutBtn">Salir</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page-main">
      <section class="container">
        <div class="page-header">
          <div>
            <p class="eyebrow">Catálogo</p>
            <h1>Celulares</h1>
          </div>
        </div>

        <div class="filter-bar">
          <button class="filter-btn active" data-filter="todos">Todos</button>
          <button class="filter-btn" data-filter="Celulares">Celulares</button>
          <button class="filter-btn" data-filter="Audífonos">Audífonos</button>
          <button class="filter-btn" data-filter="Cargadores">Cargadores</button>
          <button class="filter-btn" data-filter="Cables">Cables</button>
          <button class="filter-btn" data-filter="Fundas">Fundas</button>
          <button class="filter-btn" data-filter="Accesorios tecnológicos">Accesorios</button>
        </div>

        <div id="catalogProducts" class="product-grid"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-grid">
        <div>
          <h3>Urban Cel</h3>
          <p>Tecnología moderna para cada estilo de vida.</p>
        </div>
        <div>
          <h4>Enlaces</h4>
          <ul>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="accesorios.html">Accesorios</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </div>
        <div>
          <h4>Contacto</h4>
          <ul>
            <li>WhatsApp: +57 315 000 0000</li>
            <li>correo@urbancel.com</li>
          </ul>
        </div>
      </div>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
